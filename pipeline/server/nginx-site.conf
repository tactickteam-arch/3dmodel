# nginx for the catalogue on our own server: serves the same files, addresses and headers as vercel.json.
# Installed as /etc/nginx/sites-available/sangeetha3d by setup.sh; deploy.sh keeps /var/www/sangeetha3d in step
# with GitHub main. HTTPS is added by certbot once the subdomain points here (setup.sh says how).
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /var/www/sangeetha3d;
  index index.html;
  charset utf-8;

  # as Vercel: browsers check back on every load (ETag), so a push shows at once
  add_header Cache-Control "public, max-age=0, must-revalidate" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml model/gltf-binary;

  # no dotfiles (the deploy keeps none here, but never serve one)
  location ~ /\. { return 404; }

  # redirects: /p alone goes to the catalogue
  location = /p { return 307 /; }

  # rewrites, after the file itself, as Vercel does: a product's own page (link preview) or product.html
  location ~ ^/p/[^/]+$ { try_files $uri.html /product.html; }
  location ~ ^/(id|ar-experience|embed)/ { try_files $uri.html /index.html; }
  location ~ ^/showroom/.+ { try_files /showroom.html =404; }
  location ~ ^/compare/.+ { try_files /compare.html =404; }

  # the model files, with the types Quick Look and model-viewer need
  location /models/usdz/ {
    types { }
    default_type model/vnd.usdz+zip;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }
  location ~ ^/models/.+\.glb$ {
    types { }
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # clean addresses: /admin is admin.html, /p/<id> above, / is index.html
  location / { try_files $uri $uri.html $uri/ =404; }
}
