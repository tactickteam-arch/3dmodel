<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The 3D showroom · Sangeetha 3D and AR</title>
<meta name="description" content="Every product in one 3D showroom. Walk the aisles, open any door on your phone, or step inside on Meta Quest or Vision Pro.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sangeetha 3D and AR">
<meta property="og:title" content="The Sangeetha 3D showroom">
<meta property="og:description" content="Every product in one 3D showroom. Walk the aisles, open any door on your phone, or step inside on Meta Quest or Vision Pro.">
<meta property="og:url" content="https://3d.sangeetha.com/showroom">
<meta name="theme-color" content="#0E0E0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="/track.js" defer></script>
<script type="module" src="/store-bridge.js"></script>
<style>
  :root {
    /* Sangeetha: black, white and the orange of the logo (as product.html) */
    --navy: #0E0E0F;
    --paper: #F4F4F5;
    --card: #FFFFFF;
    --copper: #F58A29;
    --copper-dk: #B85A12;
    --copper-bg: #FDEBDC;
    --slate: #5E6066;
    --hair: #E3E3E6;
    --sans: Outfit, -apple-system, Arial, sans-serif;
    --shadow: 0 8px 24px rgba(18,34,58,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--navy); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus { outline: none; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
  a { color: inherit; }
  .hide { display: none !important; }

  /* header, as product.html */
  header { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px; background: var(--navy); color: var(--paper); }
  .brand img { height: 34px; width: auto; display: block; }
  .head-right { display: flex; align-items: center; gap: 16px; }
  .back { display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: .3px; opacity: .9; }
  .back:hover { opacity: 1; }
  .back svg { width: 18px; height: 18px; }
  .pill { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--navy); background: var(--copper); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }

  .stage { position: relative; height: calc(100vh - 64px); height: calc(100dvh - 64px); overflow: hidden; background: #E9E7E3; touch-action: none; }
  .stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  .glass { background: rgba(253,252,249,.94); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

  .hint { position: absolute; left: 20px; top: 20px; max-width: min(520px, calc(100% - 300px)); display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.35; color: var(--slate); padding: 9px 14px 9px 10px; border-radius: 999px; z-index: 5; transition: opacity .5s; pointer-events: none; }
  .hint svg { width: 18px; height: 18px; color: var(--copper-dk); flex: none; }
  .hint.gone { opacity: 0; }
  .tools { position: absolute; right: 20px; top: 20px; display: flex; gap: 8px; z-index: 6; }
  .tool { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 16px 10px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .tool svg { width: 18px; height: 18px; color: var(--copper-dk); flex: none; }
  .tool.dark { background: var(--navy); color: var(--paper); box-shadow: var(--shadow); }
  .tool.dark svg { color: var(--copper); }

  /* a name over each product near you */
  .labels { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; border: 1px solid var(--hair); background: rgba(253,252,249,.95); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; white-space: nowrap; box-shadow: 0 3px 10px rgba(14,14,15,.12); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .tag b { color: var(--copper-dk); font-weight: 600; }
  .tag[aria-pressed="true"] { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .tag[aria-pressed="true"] b { color: var(--copper); }

  /* the product you picked */
  .pcard { position: absolute; left: 20px; bottom: 150px; width: min(360px, calc(100% - 40px)); border-radius: 18px; padding: 16px 16px 14px 18px; z-index: 7; transition: opacity .25s, transform .25s; }
  .pcard.gone { opacity: 0; transform: translateY(8px); pointer-events: none; }
  .pcard .top { display: flex; align-items: flex-start; gap: 10px; }
  .pcard .logo { height: 20px; width: auto; display: block; margin-bottom: 6px; }
  .pcard small { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: var(--copper-dk); }
  .pcard h2 { margin: 3px 0 0; font-size: 18px; font-weight: 600; line-height: 1.25; }
  .pcard .meta { margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--slate); }
  .pcard .x { margin-left: auto; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #F1F1F3; display: grid; place-items: center; flex: none; }
  .pcard .x svg { width: 16px; height: 16px; }
  .pparts { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .pparts button { border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 8px 13px; font-size: 13px; font-weight: 600; }
  .pparts button:hover { border-color: var(--navy); }
  .pparts button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  .pparts button:disabled { opacity: .55; cursor: default; }
  .pcard .go { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 14.5px; font-weight: 600; color: var(--copper-dk); text-decoration: none; }
  .pcard .go:hover { text-decoration: underline; }
  .pcard .go svg { width: 16px; height: 16px; }

  /* aisles and products along the bottom */
  .dock { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(1100px, calc(100% - 32px)); border-radius: 22px; padding: 10px 10px 8px; z-index: 6; }
  .cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
  .cats::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .cat { flex: none; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .cat .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: #F1F1F3; font-size: 11.5px; }
  .cat[aria-pressed="true"] { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .cat[aria-pressed="true"] .n { background: var(--copper); color: var(--navy); }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .chip { flex: none; display: flex; align-items: center; gap: 8px; max-width: 230px; border: 1px solid var(--hair); background: #fff; border-radius: 14px; padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 500; text-align: left; }
  .chip img { width: 40px; height: 40px; border-radius: 10px; object-fit: contain; background: #fff; flex: none; }
  .chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip b { display: block; font-size: 11.5px; font-weight: 600; color: var(--copper-dk); }
  .chip[aria-pressed="true"] { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }

  .loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 9; font-size: 15px; color: var(--slate); pointer-events: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: var(--paper); padding: 12px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .missing { max-width: 560px; margin: 80px auto; padding: 0 16px; text-align: center; }

  /* in the headset the page sits behind; nothing on it is seen */
  body.in-xr .hint, body.in-xr .tools, body.in-xr .labels, body.in-xr .pcard, body.in-xr .dock { display: none !important; }

  @media (max-width: 900px) {
    header { height: 56px; padding: 0 16px; }
    .brand img { height: 28px; }
    .pill { display: none; }
    .stage { height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .hint { left: 12px; top: 12px; max-width: calc(100% - 24px); font-size: 12px; border-radius: 16px; }
    .tools { right: 12px; top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); flex-direction: column; align-items: flex-end; }
    .tool { padding: 9px 14px 9px 11px; font-size: 13px; }
    .dock { left: 0; right: 0; bottom: 0; transform: none; width: 100%; border-radius: 18px 18px 0 0; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
    .cat { padding: 6px 11px; font-size: 12.5px; }
    .chip { max-width: 190px; font-size: 12px; }
    .chip img { width: 34px; height: 34px; }
    .pcard { left: 8px; right: 8px; width: auto; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); padding: 12px 12px 10px 14px; }
    .pcard h2 { font-size: 16px; }
    .pcard .logo { height: 16px; }
    .pparts { margin-top: 8px; }
    .pparts button { padding: 7px 11px; font-size: 12.5px; }
    .pcard .go { margin-top: 8px; font-size: 13.5px; }
    .tools.carded { display: none; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/logos/sangeetha.png" alt="Sangeetha" width="105" height="34"></a>
  <div class="head-right">
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      All products
    </a>
    <span class="pill">3D &amp; AR</span>
  </div>
</header>

<main class="stage" id="stage">
  <div class="loading" id="loading">Setting out the showroom…</div>
  <div class="labels" id="labels"></div>
  <div class="hint glass" id="hint"></div>
  <div class="tools" id="tools">
    <button class="tool glass" id="btnOverview" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M3 21h18M9 21v-6h6v6"/></svg>Whole showroom</button>
    <button class="tool dark hide" id="btnVR" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="20" height="11" rx="4"/><circle cx="8" cy="12.5" r="2"/><circle cx="16" cy="12.5" r="2"/></svg>Step inside (VR)</button>
    <button class="tool dark hide" id="btnAR" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>In your room</button>
  </div>
  <div class="pcard glass gone" id="pcard" role="dialog" aria-labelledby="pcName" aria-hidden="true" inert>
    <div class="top">
      <div><img class="logo" id="pcLogo" alt=""><small id="pcCat"></small><h2 id="pcName"></h2></div>
      <button class="x" id="pcClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <p class="meta" id="pcMeta"></p>
    <div class="pparts" id="pcParts" role="group" aria-label="Open and close"></div>
    <a class="go" id="pcLink" href="/">See it in 3D and AR <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
  <nav class="dock glass" id="dock" aria-label="Products in the showroom">
    <div class="cats" id="cats"></div>
    <div class="chips" id="chips"></div>
  </nav>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/showroom.js"></script>
</body>
</html>
