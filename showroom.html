<script src="/track.js" defer></script>
<script type="module" src="/store-bridge.js"></script>
<style>
  :root {
    /* Sangeetha: black, white and the orange of the logo (as product.html) */
    --navy: #0E0E0F;
    --paper: #F4F4F5;
    --card: #FFFFFF;
    --copper: #F58A29;
    --copper-dk: #B85A12;
    --copper-bg: #FDEBDC;
    --slate: #5E6066;
    --hair: #E3E3E6;
    --sans: Outfit, -apple-system, Arial, sans-serif;
    --shadow: 0 8px 24px rgba(18,34,58,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--navy); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus { outline: none; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
  a { color: inherit; }
  .hide { display: none !important; }

  /* header, as product.html */
  header { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px; background: var(--navy); color: var(--paper); }
  .brand img { height: 34px; width: auto; display: block; }
  .head-right { display: flex; align-items: center; gap: 16px; }
  .back { display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: .3px; opacity: .9; }
  .back:hover { opacity: 1; }
  .back svg { width: 18px; height: 18px; }
  .pill { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--navy); background: var(--copper); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }

  .stage { --dock-h: 128px; position: relative; height: calc(100vh - 64px); height: calc(100dvh - 64px); overflow: hidden; background: #EEEBE6; touch-action: none; }
  .stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  .glass { background: rgba(253,252,249,.94); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

  .hint { position: absolute; left: 20px; top: 20px; max-width: calc(100% - 300px); display: flex; align-items: center; gap: 9px; font-size: 13.5px; line-height: 1.35; color: var(--navy); padding: 10px 18px 10px 12px; border-radius: 999px; z-index: 5; transition: opacity .5s; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint span { overflow: hidden; text-overflow: ellipsis; }
  .hint b { font-weight: 600; }
  .hint svg { width: 18px; height: 18px; color: var(--copper-dk); flex: none; }
  .hint.gone { opacity: 0; }
  .tools { position: absolute; right: 20px; top: 20px; display: flex; gap: 8px; z-index: 6; }
  .tool { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 16px 10px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .tool svg { width: 18px; height: 18px; color: var(--copper-dk); flex: none; }
  .tool.dark { background: var(--navy); color: var(--paper); box-shadow: var(--shadow); }
  .tool.dark svg { color: var(--copper); }

  /* a name over each product near you */
  .labels { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; border: 1px solid var(--hair); background: rgba(253,252,249,.96); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 500; white-space: nowrap; box-shadow: 0 4px 14px rgba(14,14,15,.14); max-width: 300px; overflow: hidden; text-overflow: ellipsis; transition: opacity .3s; }
  .tag b { color: var(--copper-dk); font-weight: 700; margin-right: 3px; }
  .tag[aria-pressed="true"] { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .tag[aria-pressed="true"] b { color: var(--copper); }

  /* the product you picked */
  .pcard { position: absolute; left: 20px; bottom: calc(var(--dock-h) + 30px); width: min(360px, calc(100% - 40px)); border-radius: 18px; padding: 16px 16px 14px 18px; z-index: 7; transition: opacity .25s, transform .25s; }
  .pcard.gone { opacity: 0; transform: translateY(8px); pointer-events: none; }
  .pcard .top { display: flex; align-items: flex-start; gap: 10px; }
  .pcard .logo { height: 20px; width: auto; display: block; margin-bottom: 6px; }
  .pcard small { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: var(--copper-dk); }
  .pcard h2 { margin: 3px 0 0; font-size: 18px; font-weight: 600; line-height: 1.25; }
  .pcard .meta { margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--slate); }
  .pcard .x { margin-left: auto; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #F1F1F3; display: grid; place-items: center; flex: none; }
  .pcard .x svg { width: 16px; height: 16px; }
  .pparts { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .pparts button { border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 8px 13px; font-size: 13px; font-weight: 600; }
  .pparts button:hover { border-color: var(--navy); }
  .pparts button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  .pparts button:disabled { opacity: .55; cursor: default; }
  .pcard .go { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 14.5px; font-weight: 600; color: var(--copper-dk); text-decoration: none; }
  .pcard .go:hover { text-decoration: underline; }
  .pcard .go svg { width: 16px; height: 16px; }

  /* aisles and products along the bottom */
  .dock { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(1100px, calc(100% - 32px)); border-radius: 22px; padding: 10px 10px 8px; z-index: 6; }
  .cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
  .cats::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .cat { flex: none; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .cat .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: #F1F1F3; font-size: 11.5px; }
  .cat[aria-pressed="true"] { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .cat[aria-pressed="true"] .n { background: var(--copper); color: var(--navy); }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .chip { flex: none; display: flex; align-items: center; gap: 10px; width: 250px; border: 1px solid var(--hair); background: #fff; border-radius: 14px; padding: 5px 12px 5px 5px; font-size: 13px; font-weight: 500; line-height: 1.25; text-align: left; transition: border-color .15s, box-shadow .15s; }
  .chip:hover { border-color: #C9C9CE; }
  .chip img { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; background: #fff; flex: none; }
  .chip > span { min-width: 0; }
  .chip .nm { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .chip b { display: block; font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--copper-dk); margin-bottom: 1px; }
  .chip[aria-pressed="true"] { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
  .chip.dimmed { opacity: .4; }
  .chip .mop, .res .mop { display: block; font-style: normal; font-size: 11.5px; font-weight: 500; color: var(--slate); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* search: brand, name, model or item code, as you type */
  .dock-top { display: flex; gap: 8px; align-items: flex-start; }
  .dock-top .cats { flex: 1; min-width: 0; }
  .dock-top > .fbtn { margin-left: auto; }
  .search { flex: none; position: relative; display: flex; align-items: center; gap: 7px; width: 280px; height: 36px; padding: 0 8px 0 12px; border: 1px solid var(--hair); background: #fff; border-radius: 999px; }
  .search:focus-within { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
  .search svg { width: 17px; height: 17px; color: var(--slate); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 13.5px; color: var(--navy); padding: 0; }
  .search input::placeholder { color: #8A8C92; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search kbd { font: inherit; font-size: 11.5px; font-weight: 600; color: var(--slate); border: 1px solid var(--hair); border-radius: 6px; padding: 0 6px; line-height: 18px; }
  .search:focus-within kbd { display: none; }
  .results { position: absolute; right: 10px; bottom: calc(100% + 8px); width: min(430px, calc(100% - 20px)); max-height: min(360px, 50vh); overflow-y: auto; border-radius: 16px; padding: 6px; z-index: 8; }
  .results p { margin: 0; padding: 12px; font-size: 13.5px; color: var(--slate); }
  .res { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; border-radius: 11px; padding: 6px 8px; text-align: left; font-size: 13.5px; font-weight: 500; line-height: 1.3; }
  .res:hover, .res[aria-selected="true"] { background: #F1F1F3; }
  .res img { width: 38px; height: 38px; border-radius: 8px; object-fit: contain; background: #fff; flex: none; }
  .res > span { min-width: 0; }
  .res b { color: var(--copper-dk); font-weight: 700; margin-right: 4px; }
  .res small { display: block; font-size: 12px; color: var(--slate); }
  .res mark { background: var(--copper-bg); color: inherit; border-radius: 3px; }
  .pcard .mop { margin: 6px 0 0; font-size: 14px; font-weight: 600; color: var(--navy); }
  .pswatches { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; align-items: center; }
  .pswatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--hair); padding: 0; }
  .pswatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--navy); }
  .pswatches span { font-size: 12.5px; color: var(--slate); margin-left: 2px; }
  .pacts { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .pacts button, .pacts a { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; text-decoration: none; color: var(--navy); }
  .pacts button:hover, .pacts a:hover { border-color: var(--navy); }
  .pacts svg { width: 15px; height: 15px; color: var(--copper-dk); }
  .pacts .primary { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .pacts .primary svg { color: var(--copper); }
  .pcard .retry { margin-top: 8px; }
  .search-row { display: flex; gap: 8px; flex: none; }
  .fbtn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 0 13px 0 11px; font-size: 13.5px; font-weight: 600; }
  .fbtn svg { width: 16px; height: 16px; color: var(--copper-dk); }
  .fbtn[aria-expanded="true"], .fbtn.on { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .fbtn.on svg, .fbtn[aria-expanded="true"] svg { color: var(--copper); }
  .fbtn .n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--copper); color: var(--navy); font-size: 11px; }
  .filters { position: absolute; right: 10px; bottom: calc(100% + 8px); width: min(460px, calc(100% - 20px)); max-height: min(440px, 58vh); overflow-y: auto; border-radius: 16px; padding: 14px 16px; z-index: 8; }
  .filters h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--slate); }
  .filters section + section { margin-top: 14px; }
  .fpills { display: flex; flex-wrap: wrap; gap: 6px; }
  .fpills button { border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; }
  .fpills button[aria-pressed="true"] { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .fpills button:disabled { opacity: .45; cursor: default; }
  .frange { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--slate); }
  .frange select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--hair); border-radius: 8px; background: #fff; color: var(--navy); }
  .ffoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--hair); font-size: 13.5px; }
  .ffoot b { font-weight: 700; }
  .ffoot button { border: 0; background: transparent; color: var(--copper-dk); font-weight: 600; font-size: 13.5px; padding: 4px 0; }
  /* the floor plan, top left under the hint */
  .minimap { position: absolute; left: 20px; top: 70px; z-index: 5; border-radius: 14px; padding: 8px; }
  .minimap canvas { display: block; border-radius: 8px; cursor: crosshair; touch-action: none; }
  .minimap .mm-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--slate); margin: 0 2px 6px; }
  .minimap .mm-head button { border: 0; background: transparent; padding: 2px; display: grid; place-items: center; color: var(--slate); }
  .minimap .mm-head svg { width: 16px; height: 16px; }
  .minimap.closed canvas { display: none; }
  .minimap.under { visibility: hidden; }
  .minimap.closed .mm-head { margin: 0 2px; }
  /* the guided tour's controls */
  .tourbar { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 8px 6px 16px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .tourbar span { margin-right: 6px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  .tourbar button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #F1F1F3; display: grid; place-items: center; }
  .tourbar button svg { width: 16px; height: 16px; }
  .nogl { max-width: 520px; margin: 0 16px; padding: 22px 24px; border-radius: 18px; text-align: center; font-size: 15px; line-height: 1.5; color: var(--navy); pointer-events: auto; }
  .nogl h2 { margin: 0 0 8px; font-size: 20px; }
  .nogl a { display: inline-block; margin-top: 12px; font-weight: 600; color: var(--copper-dk); }

  .loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 9; font-size: 15px; color: var(--slate); pointer-events: none; }
  .loading span { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; background: rgba(253,252,249,.94); box-shadow: var(--shadow); }
  .loading span::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--hair); border-top-color: var(--copper); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* the models near you, loading */
  .progress { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; transition: opacity .5s; }
  .progress.gone { opacity: 0; }
  .progress span { font-size: 12px; font-weight: 500; color: var(--slate); background: rgba(253,252,249,.9); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .progress .bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(14,14,15,.1); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--copper); transform-origin: left; transform: scaleX(0); transition: transform .4s; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: var(--paper); padding: 12px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .missing { max-width: 560px; margin: 80px auto; padding: 0 16px; text-align: center; }

  /* in the headset the page sits behind; nothing on it is seen */
  body.in-xr .minimap, body.in-xr .tourbar, body.in-xr .hint, body.in-xr .tools, body.in-xr .labels, body.in-xr .pcard, body.in-xr .dock, body.in-xr .progress, body.in-xr .filters, body.in-xr .results { display: none !important; }

  @media (max-width: 900px) {
    header { height: 56px; padding: 0 16px; }
    .brand img { height: 28px; }
    .pill { display: none; }
    .stage { height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .hint { left: 12px; top: 12px; max-width: calc(100% - 170px); font-size: 12px; border-radius: 16px; white-space: normal; } /* (beside the folded floor plan) */
    .progress { top: auto; bottom: calc(var(--dock-h) + 108px); } /* (above the two buttons) */
    .tools { right: 12px; top: auto; bottom: calc(var(--dock-h) + 12px); flex-direction: column; align-items: flex-end; }
    .tool { padding: 9px 14px 9px 11px; font-size: 13px; }
    .dock { left: 0; right: 0; bottom: 0; transform: none; width: 100%; border-radius: 18px 18px 0 0; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
    .cat { padding: 6px 11px; font-size: 12.5px; }
    .chip { width: 210px; font-size: 12px; }
    .chip img { width: 38px; height: 38px; }
    .chip .mop { display: none; }
    /* the categories get a row of their own that scrolls by itself; filters and search share the row under it */
    .dock-top { flex-wrap: wrap; row-gap: 6px; }
    .dock-top .cats { flex: 1 0 100%; padding-bottom: 2px; }
    .dock-top > .fbtn { margin-left: 0; }
    .search { flex: 1; width: auto; height: 32px; padding: 0 6px 0 10px; }
    .search kbd { display: none; }
    .search input { font-size: 16px; } /* (no zoom on iPhone when it takes focus) */
    .results { left: 8px; right: 8px; width: auto; }
    .fbtn { height: 32px; padding: 0 10px; font-size: 12.5px; }
    .fbtn .lbl { display: none; }
    .filters { left: 8px; right: 8px; width: auto; }
    .minimap { left: auto; right: 12px; top: 12px; padding: 6px; }
    .tourbar { top: auto; bottom: calc(var(--dock-h) + 12px); }
    .pacts button, .pacts a { padding: 6px 10px; font-size: 12.5px; }
    /* one row on a phone, so the card leaves the product in view: Share shows its icon only */
    .pacts #pcShare .lbl { display: none; }
    .pacts #pcShare { padding: 6px 9px; }
    .pacts #pcCompare { min-width: 0; }
    .pacts #pcCompare span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
    .pcard { left: 8px; right: 8px; width: auto; bottom: calc(var(--dock-h) + 8px); padding: 12px 12px 10px 14px; }
    .pcard h2 { font-size: 16px; }
    .pcard .logo { height: 16px; }
    .pparts { margin-top: 8px; }
    .pparts button { padding: 7px 11px; font-size: 12.5px; }
    .pcard .go { margin-top: 8px; font-size: 13.5px; }
    .tools.carded { display: none; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/logos/sangeetha.png" alt="Sangeetha" width="105" height="34"></a>
  <div class="head-right">
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      All products
    </a>
    <span class="pill">3D &amp; AR</span>
  </div>
</header>

<main class="stage" id="stage">
  <div class="loading" id="loading"><span>Setting out the showroom…</span></div>
  <div class="progress gone" id="progress" aria-hidden="true"><div class="bar"><i></i></div><span></span></div>
  <div class="labels" id="labels"></div>
  <div class="hint glass" id="hint"></div>
  <div class="minimap glass" id="minimap"><div class="mm-head"><span>Floor plan</span><button id="mmToggle" type="button" aria-expanded="true" aria-label="Hide the floor plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg></button></div><canvas id="mmCanvas" aria-label="Floor plan: tap a spot to walk there" role="img"></canvas></div>
  <div class="tourbar glass hide" id="tourbar" role="group" aria-label="Guided tour"><span id="tourText"></span>
    <button id="tourPlay" type="button" aria-label="Pause the tour"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg></button>
    <button id="tourNext" type="button" aria-label="Next stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="tourStop" type="button" aria-label="End the tour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="tools" id="tools">
    <button class="tool glass" id="btnOverview" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M3 21h18M9 21v-6h6v6"/></svg>Whole showroom</button>
    <button class="tool glass" id="btnTour" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>Guided tour</button>
    <button class="tool dark hide" id="btnVR" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="20" height="11" rx="4"/><circle cx="8" cy="12.5" r="2"/><circle cx="16" cy="12.5" r="2"/></svg>Step inside (VR)</button>
    <button class="tool dark hide" id="btnAR" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>In your room</button>
  </div>
  <div class="pcard glass gone" id="pcard" role="dialog" aria-labelledby="pcName" aria-hidden="true" inert>
    <div class="top">
      <div><img class="logo" id="pcLogo" alt=""><small id="pcCat"></small><h2 id="pcName"></h2></div>
      <button class="x" id="pcClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <p class="meta" id="pcMeta"></p>
    <p class="mop" id="pcMop"></p>
    <div class="pswatches hide" id="pcSwatches" role="group" aria-label="Colour"></div>
    <div class="pparts" id="pcParts" role="group" aria-label="Open and close"></div>
    <button class="go retry hide" id="pcRetry" type="button">Try loading it again</button>
    <div class="pacts" id="pcActs">
      <a class="primary" id="pcLink" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>View in your room</a>
      <button id="pcCompare" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v16M15 4v16M4 8h5M15 16h5"/></svg><span>Compare</span></button>
      <button id="pcShare" type="button" aria-label="Share this spot" title="Share this spot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="lbl">Share this spot</span></button>
    </div>
  </div>
  <nav class="dock glass" id="dock" aria-label="Products in the showroom">
    <div class="dock-top">
      <div class="cats" id="cats"></div>
      <button class="fbtn" id="btnFilters" type="button" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="lbl">Filters</span></button>
      <div class="search" id="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search brand, model or item code" autocomplete="off" spellcheck="false" aria-label="Search the showroom" aria-controls="results" aria-expanded="false" enterkeyhint="go">
        <kbd>/</kbd>
      </div>
    </div>
    <div class="results glass hide" id="results" role="listbox" aria-label="Products found"></div>
    <div class="filters glass hide" id="filters" role="dialog" aria-label="Filters"></div>
    <div class="chips" id="chips"></div>
  </nav>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/showroom.js"></script>
</body>
</html>
