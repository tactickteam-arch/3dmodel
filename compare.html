<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compare in 3D</title>
<meta name="description" content="Two products side by side in 3D, at the same scale, turning together. Open their doors and compare their size and specifications.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sangeetha 3D and AR">
<meta property="og:title" content="Compare two products in 3D">
<meta property="og:description" content="Two products side by side in 3D, at the same scale, turning together. Open their doors and compare their size and specifications.">
<meta property="og:url" content="https://3dmodelssangeetha.vercel.app/compare">
<meta name="theme-color" content="#0E0E0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<script src="/track.js" defer></script>
<script type="module" src="/store-bridge.js"></script>
<style>
  :root {
    /* Sangeetha: black, white and the orange of the logo (as product.html) */
    --navy: #0E0E0F;
    --paper: #F4F4F5;
    --card: #FFFFFF;
    --copper: #F58A29;
    --copper-dk: #B85A12;
    --copper-bg: #FDEBDC;
    --slate: #5E6066;
    --hair: #E3E3E6;
    --stage: #E7E7EA;
    --sans: Outfit, -apple-system, Arial, sans-serif;
    --shadow: 0 8px 24px rgba(18,34,58,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--navy); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus { outline: none; }
  button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
  a { color: inherit; }
  .hide { display: none !important; }

  /* header, as product.html */
  header { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px; background: var(--navy); color: var(--paper); }
  .brand img { height: 34px; width: auto; display: block; }
  .head-right { display: flex; align-items: center; gap: 16px; }
  .back { display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: .3px; opacity: .9; }
  .back:hover { opacity: 1; }
  .back svg { width: 18px; height: 18px; }
  .pill { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--navy); background: var(--copper); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 28px 48px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 22px 0 16px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--copper-dk); }
  h1 { font-weight: 600; font-size: 30px; line-height: 1.15; letter-spacing: -0.3px; margin: 6px 0 0; }
  .lede { margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: var(--slate); }
  .reset { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 10px 16px 10px 12px; font-size: 14px; font-weight: 600; }
  .reset svg { width: 18px; height: 18px; color: var(--copper-dk); }

  /* two columns, on every screen */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .col { min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; overflow: hidden; }
  .head { padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--hair); }
  .head .logo { height: 22px; width: auto; align-self: flex-start; margin-bottom: 6px; }
  .head h2 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.25; }
  .model-no { align-self: flex-start; margin-top: 4px; font-size: 13px; font-weight: 600; letter-spacing: .4px; color: var(--slate); background: #F1F1F3; border-radius: 6px; padding: 4px 8px; overflow-wrap: anywhere; }
  .head .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .open { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--copper-dk); text-decoration: none; }
  .open:hover { text-decoration: underline; }
  .open svg { width: 16px; height: 16px; }
  .pick { position: relative; display: inline-flex; align-items: center; }
  .pick select { appearance: none; -webkit-appearance: none; max-width: 100%; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 8px 32px 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; text-overflow: ellipsis; }
  .pick svg { position: absolute; right: 11px; width: 14px; height: 14px; pointer-events: none; color: var(--slate); }

  .stage { position: relative; height: min(62vh, 640px); min-height: 380px; background: radial-gradient(ellipse at 50% 42%, #FBFBFC 0%, var(--stage) 75%); }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; --progress-bar-color: transparent; background: transparent; }
  model-viewer:focus { outline: none; }
  model-viewer::part(default-progress-bar) { display: none; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--slate); font-size: 15px; line-height: 1.5; }
  .progress { position: absolute; left: 50%; bottom: 24px; width: 140px; height: 3px; margin-left: -70px; background: rgba(18,34,58,.12); border-radius: 3px; overflow: hidden; transition: opacity .3s; }
  .progress i { display: block; height: 100%; width: 0; background: var(--copper-dk); transition: width .2s; }
  .progress.done { opacity: 0; }

  .parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 10px 12px 4px; }
  .parts button { display: flex; align-items: center; gap: 7px; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 9px 14px 9px 11px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .parts button:hover { border-color: var(--navy); }
  .parts button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  .parts svg { width: 16px; height: 16px; color: var(--copper-dk); flex: none; }
  .parts button[aria-pressed="true"] svg { color: var(--copper); }
  .swatches { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 6px 12px 14px; }
  .swatch { display: flex; align-items: center; gap: 8px; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 500; }
  .swatch i { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); background-size: cover; background-position: center; }
  .swatch[aria-pressed="true"] { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
  .foot { padding-bottom: 10px; }

  /* one table: Size first, then every specification either product lists */
  .specs { margin-top: 22px; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; padding: 20px 22px 8px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--slate); margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { text-align: left; vertical-align: top; padding: 11px 10px 11px 0; border-top: 1px solid var(--hair); font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }
  thead th { border-top: 0; font-size: 14px; font-weight: 600; padding-top: 4px; }
  tbody th { width: 24%; font-weight: 500; color: var(--slate); }
  td { font-weight: 500; }
  td.none { color: #A9AAB0; }
  tr.size td { font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: var(--paper); padding: 12px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 900px) {
    header { height: 56px; padding: 0 16px; }
    header .brand img { height: 28px; }
    .pill { display: none; }
    .wrap { padding: 0 10px 32px; }
    .top { padding: 16px 6px 12px; gap: 10px; }
    h1 { font-size: 23px; }
    .lede { font-size: 13.5px; }
    .reset { padding: 8px 12px 8px 10px; font-size: 13px; }
    .cols { gap: 8px; }
    .col { border-radius: 16px; }
    .head { padding: 12px 10px 10px; }
    .head .logo { height: 17px; margin-bottom: 4px; }
    .head h2 { font-size: 15px; }
    .model-no { font-size: 11px; padding: 3px 6px; }
    .head .row { margin-top: 6px; gap: 6px; }
    .open { font-size: 12.5px; }
    .pick, .pick select { width: 100%; }
    .pick select { font-size: 12.5px; padding: 7px 26px 7px 10px; }
    .stage { height: 46svh; min-height: 300px; }
    .parts { padding: 8px 6px 2px; gap: 5px; }
    .parts button { min-height: 40px; padding: 7px 10px 7px 8px; font-size: 12px; gap: 5px; white-space: normal; text-align: left; } /* big enough for a thumb */
    .parts svg { width: 14px; height: 14px; }
    .swatches { padding: 4px 6px 10px; }
    .swatch { font-size: 12px; padding: 3px 9px 3px 3px; }
    .swatch i { width: 20px; height: 20px; }
    .specs { padding: 16px 12px 6px; border-radius: 16px; }
    th, td { font-size: 13px; padding: 9px 6px 9px 0; }
    thead th { font-size: 12.5px; }
    tbody th { width: 30%; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/logos/sangeetha.png" alt="Sangeetha" width="105" height="34"></a>
  <div class="head-right">
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      All products
    </a>
    <span class="pill">3D &amp; AR</span>
  </div>
</header>

<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">Compare in 3D</div>
      <h1 id="title">Side by side, at the same scale</h1>
      <p class="lede">Both turn and zoom together, so the bigger one looks bigger. Tap a door to open it.</p>
    </div>
    <button class="reset" id="btnReset" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset view</button>
  </div>

  <div class="cols" id="cols"></div>

  <section class="specs">
    <h2 class="label">Size and specifications</h2>
    <table id="specs"></table>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { esc, cm, partAt, finishSlug, finishIndexOf, CATEGORIES } from "/site.js";
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  door: svg('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 9h14M8 5.5v1.5M8 11.5v3"/>'),
  round: svg('<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="4.5"/><path d="M7 6.5h4"/>'),
  louvre: svg('<rect x="2" y="6" width="20" height="8" rx="2"/><path d="M5 17l2 3M12 17v3M19 17l-2 3"/>'),
  panel: svg('<path d="M3 10 21 5"/><rect x="2" y="12" width="20" height="7" rx="2"/><path d="M6 15.5h12"/>'),
  drawer: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M7 7h5"/>'),
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  chevron: svg('<path d="m6 9 6 6 6-6"/>'),
};
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 3000);
}

// ── which two: /compare?a=<id>&b=<id> (from the catalogue's Compare bar), with ?fa= and ?fb= for their colours ──
const products = (await fetch("/products.json").then((r) => r.json())).products.filter((p) => !p.hidden);
const params = new URLSearchParams(location.search);
const find = (id) => products.find((p) => p.id === String(id || "").toLowerCase()) || null;
const SIDES = ["a", "b"];
// the product most like p: the same category, nearest in size (a fridge beside a washer tells a shopper little)
const sizeGap = (p, q) => ["w", "h", "d"].reduce((t, k) => t + Math.abs(cm(p.size[k]) - cm(q.size[k])), 0);
const nearest = (p) => products.filter((q) => q !== p && q.category === p.category).sort((x, y) => sizeGap(p, x) - sizeGap(p, y))[0]
  || products.find((q) => q !== p) || null;
// The two the address names, as given: any two the catalogue's Compare bar picked. A side the address leaves out
// (or names a product no longer on show) gets the one most like the other side; with neither, the first category
// with two products, its first and the one most like it. The address is then set to what is shown.
const picked = [find(params.get("a")), find(params.get("b"))];
const lost = SIDES.some((x, i) => params.get(x) && !picked[i]);
if (picked[0] && picked[0] === picked[1]) picked[1] = nearest(picked[0]);
if (!picked[0] && !picked[1]) {
  const cat = [...CATEGORIES.map(([c]) => c), ...products.map((p) => p.category)].find((c) => products.filter((p) => p.category === c).length > 1);
  picked[0] = products.find((p) => p.category === cat) || products[0] || null;
  picked[1] = picked[0] && nearest(picked[0]);
} else if (!picked[0]) picked[0] = nearest(picked[1]);
else if (!picked[1]) picked[1] = nearest(picked[0]);
if (picked.every(Boolean) && SIDES.some((x, i) => params.get(x) !== picked[i].id)) {
  const u = new URL(location.href);
  SIDES.forEach((x, i) => { if (params.get(x) !== picked[i].id) { u.searchParams.set(x, picked[i].id); u.searchParams.delete(`f${x}`); } });
  history.replaceState(history.state, "", u.pathname + u.search);
}
const model = (url) => `${url}?v=7`; // the same files and cache key as product.html

// ── one camera for both: the same lens, distance and target, so a 1.8 m fridge stands twice as tall as a
// 0.9 m washer. The distance frames the bigger of the two; the target is half the taller one's height. ──
const FOV = 30;
const shown = picked.filter(Boolean);
const dims = shown.map((p) => ({ w: cm(p.size.w) / 100, h: cm(p.size.h) / 100, d: cm(p.size.d) / 100, wall: p.placement === "wall" }));
const reach = Math.max(0.5, ...dims.map((d) => Math.hypot(d.w, d.h, d.d) / 2));
const R = +(1.08 * reach / Math.sin((FOV / 2) * Math.PI / 180)).toFixed(3);
const allWall = dims.length && dims.every((d) => d.wall);
// wall units hang from their back (z = 0), floor units are centred on it
const target = `0m ${(Math.max(...dims.map((d) => d.h), 0.5) / 2).toFixed(3)}m ${allWall ? (Math.min(...dims.map((d) => d.d)) / 2).toFixed(3) : 0}m`;
// a wall unit turns only as far as its sides (as on its own page), and then both do
const anyWall = dims.some((d) => d.wall);
const [theta0, phi0] = (shown[0]?.orbit || "-28deg 78deg").split(" ");
const home = `${theta0} ${phi0} ${R}m`;

const optionList = (current) => {
  const cats = [...new Set(products.map((p) => p.category))];
  return `<option value="" ${current ? "" : "selected"} disabled>Choose a product</option>` + cats.map((c) => `<optgroup label="${esc(c)}">${products.filter((p) => p.category === c)
    .map((p) => `<option value="${esc(p.id)}" ${current?.id === p.id ? "selected" : ""}>${esc(p.brand)} ${esc(p.shortName)}</option>`).join("")}</optgroup>`).join("");
};
const iconFor = (p, part) => (part.key === "louvre" ? I.louvre : part.key === "panel" ? I.panel : part.key === "drawer" || part.key === "trays" ? I.drawer : p.category === "Washing machine" ? I.round : I.door);

const sides = SIDES.map((s, i) => makeSide(s, picked[i]));
document.title = shown.length === 2 ? `Compare ${shown[0].brand} ${shown[0].model} and ${shown[1].brand} ${shown[1].model} in 3D` : "Compare in 3D";
if (shown.length === 2) $("title").textContent = `${shown[0].brand} ${shown[0].shortName} and ${shown[1].brand} ${shown[1].shortName}`;
else $("title").textContent = "Choose two products to compare";

function makeSide(side, p) {
  const col = document.createElement("section");
  col.className = "col";
  col.dataset.side = side;
  const other = side === "a" ? "b" : "a";
  col.innerHTML = `
    <div class="head">
      ${p ? `<img class="logo" src="${p.brandLogo}" alt="${esc(p.brand)}"><div class="eyebrow">${esc(p.category)}</div><h2>${esc(p.shortName)}</h2><span class="model-no">Model ${esc(p.model)}</span>` : ""}
      <div class="row">
        <label class="pick"><span class="hide">${p ? "Change this product" : "Choose a product"}</span><select aria-label="${p ? "Change this product" : "Choose a product"}">${optionList(p)}</select>${I.chevron}</label>
        ${p ? `<a class="open" href="/p/${esc(p.id)}">Open in 3D and AR ${I.arrow}</a>` : ""}
      </div>
    </div>
    <div class="stage">${p ? "" : `<div class="empty">Choose a product above to compare it here.</div>`}</div>
    <div class="foot"><div class="parts" role="group" aria-label="Open and close"></div><div class="swatches"></div></div>`;
  $("cols").appendChild(col);
  // any product can be chosen; one of another category (or the same one) brings the other side along, to the one
  // most like it
  col.querySelector("select").addEventListener("change", (e) => {
    const u = new URL(location.href), chosen = find(e.target.value), them = picked[SIDES.indexOf(other)];
    u.searchParams.set(side, chosen.id);
    u.searchParams.delete(`f${side}`);
    if (them && (them.category !== chosen.category || them === chosen)) { u.searchParams.set(other, nearest(chosen).id); u.searchParams.delete(`f${other}`); }
    location.href = u.pathname + u.search;
  });
  if (!p) return { side, product: null };

  const mv = document.createElement("model-viewer");
  for (const [k, v] of Object.entries({
    alt: `${p.brand} ${p.name} in 3D`, poster: p.thumb, "camera-controls": "", "touch-action": "pan-y", "disable-tap": "", "disable-pan": "",
    "interaction-prompt": "none", "shadow-intensity": "1", "shadow-softness": "0.8", "environment-image": "/env/studio.hdr", exposure: "1.05",
    "field-of-view": `${FOV}deg`, "min-field-of-view": `${FOV}deg`, "max-field-of-view": `${FOV}deg`,
    "camera-target": target, "camera-orbit": home,
    "min-camera-orbit": `${anyWall ? "-100deg" : "-Infinity"} 22.5deg ${(R * 0.45).toFixed(3)}m`,
    "max-camera-orbit": `${anyWall ? "100deg" : "Infinity"} 157.5deg ${(R * 1.8).toFixed(3)}m`,
  })) mv.setAttribute(k, v);
  mv.innerHTML = `<div slot="progress-bar" class="progress"><i></i></div>`;
  col.querySelector(".stage").appendChild(mv);
  mv.addEventListener("progress", (e) => {
    const t = e.detail.totalProgress, bar = mv.querySelector(".progress");
    bar.querySelector("i").style.width = `${Math.round(t * 100)}%`;
    bar.classList.toggle("done", t >= 1);
  });

  // ── its colour: ?fa= / ?fb=, kept in the address when changed, as ?finish= on the product page ──
  let finishIndex = finishIndexOf(p, find(params.get(side)) === p ? params.get(`f${side}`) : null); // a colour named for the product it was named with
  const swatches = col.querySelector(".swatches");
  function applyFinish(i, remember) {
    finishIndex = i;
    const f = p.finishes[i];
    if (f.variant || p.finishes.length > 1) mv.variantName = f.variant || null;
    swatches.querySelectorAll(".swatch").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    if (!remember) return;
    const u = new URL(location.href);
    u.searchParams.set(`f${side}`, finishSlug(f.name));
    history.replaceState(history.state, "", u.pathname + u.search);
  }
  if (p.finishes.length > 1) {
    swatches.innerHTML = p.finishes.map((f) => `<button class="swatch" type="button" aria-pressed="false"><i style="${f.swatch ? `background-image:url(${esc(f.swatch)})` : `background:${esc(f.swatchColor || "#ddd")}`}"></i>${esc(f.name)}</button>`).join("");
    swatches.querySelectorAll(".swatch").forEach((b, i) => b.addEventListener("click", () => applyFinish(i, true)));
  }
  applyFinish(finishIndex, false);
  mv.src = model(p.glb);

  // ── moving parts: the model carries one clip per change of state, named S<bits>_<bits> (as product.html) ──
  const parts = p.parts || [];
  const state = Object.fromEntries(parts.map((x) => [x.key, false]));
  const bar = col.querySelector(".parts");
  const label = (x) => (x.text ? x.text[state[x.key] ? 1 : 0] : `${state[x.key] ? "Close" : "Open"} ${x.label}`);
  for (const x of parts) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.key = x.key;
    b.innerHTML = `${iconFor(p, x)}<span></span>`;
    b.addEventListener("click", () => pressPart(x.key));
    bar.appendChild(b);
  }
  const renderParts = () => bar.querySelectorAll("button").forEach((b) => { b.setAttribute("aria-pressed", String(state[b.dataset.key])); b.querySelector("span").textContent = label(parts.find((x) => x.key === b.dataset.key)); });
  renderParts();
  const stateKey = () => parts.map((x) => (state[x.key] ? 1 : 0)).join("");
  // a clip starts from a paused element once the last one has ended: model-viewer cross-fades from a clip still running
  const clipEnded = () => (mv.paused ? null : new Promise((r) => { mv.addEventListener("finished", r, { once: true }); setTimeout(r, 1200); }));
  let busy = false, chain = Promise.resolve();
  const pressing = new Set();
  async function togglePart(key) {
    if (busy || !(key in state) || !mv.loaded) return;
    // a part inside another opens its outer part first; every open part inside one shuts before it does
    const self = parts.find((x) => x.key === key);
    const first = self?.needs && !state[key] && !state[self.needs] ? [self.needs] : state[key] ? parts.filter((x) => x.needs === key && state[x.key]).map((x) => x.key) : [];
    for (const k of first) { await togglePart(k); await sleep(950); }
    busy = true;
    await clipEnded();
    mv.pause();
    const from = stateKey();
    state[key] = !state[key];
    mv.animationName = `S${from}_${stateKey()}`;
    await mv.updateComplete;
    mv.currentTime = 0;
    mv.play({ repetitions: 1 });
    renderParts();
    setTimeout(() => (busy = false), 900);
  }
  // a press while a part moves waits its turn; a second press on the same part while it waits does nothing
  function pressPart(key) {
    if (pressing.has(key)) return;
    if (!state[key]) window.s3dTrack?.("PART", p.id, key);
    pressing.add(key);
    chain = chain.then(async () => { while (busy) await sleep(50); await togglePart(key); while (busy) await sleep(50); }).catch(() => {}).finally(() => pressing.delete(key));
  }
  // a tap (not a drag) on the product opens the part under the finger: the parts' zones (site.js)
  let press = null;
  mv.addEventListener("pointerdown", (e) => (press = { x: e.clientX, y: e.clientY, t: Date.now() }));
  mv.addEventListener("pointerup", (e) => {
    if (!press) return;
    const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y), quick = Date.now() - press.t < 450;
    press = null;
    if (moved > 6 || !quick || !parts.length) return;
    const hit = mv.positionAndNormalFromPoint(e.clientX, e.clientY);
    const key = hit ? partAt(p, state, hit.position) : null;
    if (key) pressPart(key);
  });
  mv.addEventListener("load", () => { for (const k in state) state[k] = false; renderParts(); });
  return { side, product: p, mv, state, togglePart, pressPart, get finishIndex() { return finishIndex; }, applyFinish };
}

// ── the cameras move together: a drag, pinch or scroll on one is copied to the other, frame by frame ──
const live = sides.filter((s) => s.mv);
for (const s of live) s.mv.addEventListener("camera-change", (e) => {
  if (e.detail.source !== "user-interaction") return;
  const o = s.mv.getCameraOrbit();
  for (const t of live) {
    if (t === s) continue;
    t.mv.cameraOrbit = `${o.theta}rad ${o.phi}rad ${o.radius}m`;
    t.mv.jumpCameraToGoal();
  }
});
$("btnReset").addEventListener("click", () => { for (const s of live) { s.mv.cameraOrbit = home; s.mv.cameraTarget = target; } });

// ── one table: Size first, then every label either lists, in the order the first one lists them ──
const labels = [...new Set(shown.flatMap((p) => p.specs.map(([k]) => k)))];
const cellFor = (p, k) => { const v = p?.specs.find(([x]) => x === k)?.[1]; return v ? `<td>${esc(v)}</td>` : `<td class="none">–</td>`; };
const sizeOf = (p) => (p ? `<td>${parseFloat(p.size.w)} × ${parseFloat(p.size.h)} × ${parseFloat(p.size.d)} cm</td>` : `<td class="none">–</td>`);
$("specs").innerHTML = `
  <thead><tr><th scope="col"><span class="hide">Specification</span></th>${picked.map((p) => `<th scope="col">${p ? `${esc(p.brand)} ${esc(p.shortName)}` : "–"}</th>`).join("")}</tr></thead>
  <tbody>
    <tr class="size"><th scope="row">Size (W × H × D)</th>${picked.map(sizeOf).join("")}</tr>
    ${labels.map((k) => `<tr><th scope="row">${esc(k)}</th>${picked.map((p) => cellFor(p, k)).join("")}</tr>`).join("")}
  </tbody>`;
if (lost) toast("One of those products isn’t in the catalogue any more, so the one most like the other is shown.");

// test hook for automated checks
window.__compare = { sides, R, target, home, labels };
</script>
</body>
